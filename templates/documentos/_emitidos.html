{% if documentos %}
<ul class="list-group list-group-flush">
  {% for d in documentos %}
    <a href="{% url 'documentos:documento' d.pk %}" class="list-group-item list-group-item-action small d-flex justify-content-between {% if d.anulado %}text-muted text-decoration-line-through{% endif %}">
      <span><i class="bi {{ d.definicion.icono|default:'bi-file-earmark' }} me-1"></i>{{ d.definicion.nombre|default:d.tipo }} <span class="text-muted">{{ d.numero }}</span></span>
      <span class="text-muted">{{ d.fecha|date:"d/m/Y" }}</span>
    </a>
  {% endfor %}
</ul>
{% else %}<p class="small text-muted mb-0 p-3">Sin documentos emitidos.</p>{% endif %}
